# WS2 monolayer — the other p-type channel candidate imec named alongside
# WSe2 in the June-2026 300mm demo. Previously an honest all-null
# placeholder (no source found via web search); RESOLVED 2026-07-21 by
# downloading and directly parsing the real JARVIS-DFT dft_2d dataset
# (figshare file 38521268, the exact URL used by jarvis-tools' own source
# code) rather than guessing an ID or relying on search-engine indexing,
# which had failed to surface this entry in an earlier session. JVASP-658.
#
# NOTE (2026-07-21): JARVIS-DFT JVASP-658 reports effective_mass_electron
# = 612.59 m0, anomalously large vs. commonly-cited WS2 literature values
# (~0.3-0.5 m0). Flagged, not silently corrected, at the time.
#
# RESOLVED 2026-07-28: cross-checked against two independent, credible,
# peer-reviewed sources per the flagged open_item, both read directly (PDF
# text extracted via pypdf, not a search-engine summary):
#   - Kormanyos, Burkard, Gmitra, Fabian, Zolyomi, Drummond, Falko,
#     "k.p theory for two-dimensional transition metal dichalcogenide
#     semiconductors," 2D Materials 2, 022001 (2015), DOI
#     10.1088/2053-1583/2/2/022001, arXiv:1410.6666 -- Table 3: WS2
#     conduction-band (K-point) effective mass m_cb/me = 0.26 (HSE,LDA
#     band structure) / 0.27 (PBE,PBE).
#   - Shi, Pan, Zhang, Yakobson, "Quasiparticle band structures and
#     optical properties of strained monolayer MoS2 and WS2," Phys. Rev. B
#     87, 155304 (2013), DOI 10.1103/PhysRevB.87.155304, arXiv:1211.5653 --
#     Table II: WS2 Ke (scGW0, K point) = 0.24 (experimental lattice) /
#     0.22 (optimized lattice).
# Both independently land in the same 0.22-0.27 m0 range, confirming the
# JARVIS-DFT value is a real database anomaly, not a legitimate outlier.
# effective_mass_electron below is now Kormanyos et al.'s HSE,LDA value
# (0.26); the original JARVIS-DFT figure is preserved, not deleted, in
# extra.superseded_values for traceability. See docs/DECISIONS.md
# 2026-07-28.

