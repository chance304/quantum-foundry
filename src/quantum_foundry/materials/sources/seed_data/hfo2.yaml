# HfO2 (monoclinic, baddeleyite structure) — candidate gate dielectric.
#
# Verified 2026-07-20 via direct fetch of mp-352's real materialsproject.org
# page. Note: DFT band gaps (semi-local GGA, as used here) systematically
# underestimate the true optical gap — the 4.068 eV value below is the raw
# DFT-computed number, not a claim about the experimental gap (~5.7 eV is
# more commonly cited experimentally; that number was NOT independently
# verified this session and is not included here to avoid conflating a
# recalled figure with a fetched one).
#
# lattice_constant_angstrom is null: monoclinic HfO2 has independent a/b/c/beta
# parameters that don't reduce to one scalar — see extra.lattice_parameters
# and docs/DECISIONS.md 2026-07-20 "lattice_constant_angstrom made optional".

