name: Physics or data issue
description: A material value, citation, benchmark or physical model looks wrong
labels: [physics]
body:
  - type: textarea
    id: what
    attributes:
      label: What looks wrong
      description: Which material/field/benchmark/model, and the current value or behaviour.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: The paper, database entry or dataset (with DOI, figure/table, or record ID) that supports the correction. Every value in this project needs a citation.
    validations:
      required: true
